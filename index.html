<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOAT ✓ CHECK</title>
<style>
:root{
  --navy:#071c36;
  --navy2:#12395f;
  --bg:#f4f6f9;
  --text:#10223d;
  --line:#e0e5eb;
  --blue:#1771d9;
  --green:#18a957;
  --yellow:#e6a600;
  --red:#df2937;
  --g3:#1771d9;
  --g2:#78b82d;
  --g1:#b48a2b;
  --sg:#df2937;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;
}
button{font:inherit}
header{
  background:linear-gradient(135deg,var(--navy),#0d315d);
  color:#fff;
  padding:15px 14px 13px;
  box-shadow:0 3px 13px rgba(0,0,0,.2);
}
.logo{
  font-size:24px;
  font-weight:900;
}
.logo b{color:#328cff}
.tag{
  font-size:9px;
  color:#cbd7e8;
  margin-top:4px;
}
main{
  max-width:1000px;
  margin:auto;
  padding:14px 10px 30px;
}
h2{
  margin:0 0 4px;
  font-size:24px;
}
.date{
  color:#778499;
  font-size:11px;
  margin-bottom:12px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}
.card{
  position:relative;
  min-height:111px;
  background:linear-gradient(180deg,#fff,#fafbfd);
  border:1px solid #dfe4ea;
  border-radius:11px;
  box-shadow:
    0 5px 14px rgba(8,29,59,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
  padding:8px 5px;
  overflow:hidden;
  cursor:pointer;
}
.card.end{
  background:linear-gradient(180deg,#f0f2f5,#e7eaee);
  box-shadow:0 3px 8px rgba(0,0,0,.06);
  cursor:default;
}
.card::after{
  content:"";
  position:absolute;
  left:8px;
  bottom:4px;
  width:52px;
  height:18px;
  opacity:.035;
  background:#10223d;
  border-radius:100% 20% 50% 20%;
}
.accent{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
}
.g3a{background:var(--g3)}
.g2a{background:var(--g2)}
.g1a{background:var(--g1)}
.sga{background:var(--sg)}
.icons{
  position:absolute;
  top:5px;
  right:6px;
  font-size:12px;
}
.heart{color:#e84f90}
.name{
  text-align:center;
  font-size:15px;
  font-weight:900;
  margin:7px 0 7px;
}
.meta{
  border-top:1px solid #e8ecf1;
  padding-top:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:8px;
  font-weight:800;
}
.grade{
  display:inline-block;
  border-radius:4px;
  padding:3px 5px;
  color:#fff;
  font-weight:900;
}
.normal,
.women{
  padding:0;
  background:none;
  color:var(--text);
}
.g3{background:var(--g3)}
.g2{background:var(--g2)}
.g1{background:var(--g1)}
.sg{background:var(--sg)}
.race{
  display:flex;
  align-items:end;
  justify-content:center;
  gap:9px;
  margin-top:7px;
}
.round{
  font-size:14px;
  font-weight:900;
}
.time{
  text-align:center;
  color:#8793a3;
  font-size:7px;
}
.time b{
  display:block;
  color:var(--text);
  font-size:11px;
}
.ended{
  height:54px;
  display:grid;
  place-items:center;
}
.ended b{
  background:#3d4651;
  color:#fff;
  padding:5px 10px;
  border-radius:999px;
  font-size:10px;
}
.guide{
  margin-top:15px;
  background:#fff;
  border:1px solid #d9e0e8;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 14px rgba(8,29,59,.08);
}
.guide-title{
  background:linear-gradient(135deg,var(--navy),#214d80);
  color:#fff;
  padding:9px 12px;
  font-size:14px;
  font-weight:900;
}
.guide-top{
  display:grid;
  grid-template-columns:1fr 2fr;
}
.ratebox{
  padding:12px;
  border-right:1px solid var(--line);
}
.ratebox b{
  display:block;
  font-size:13px;
}
.ratebox p{
  margin:5px 0 0;
  color:#5f6c7d;
  font-size:10px;
  line-height:1.5;
}
.bar{
  height:6px;
  margin:8px 0 4px;
  border-radius:999px;
  background:linear-gradient(90deg,#2587df,#79c94b,#f1c31b,#ed8d28,#e3313b);
}
.scale{
  display:flex;
  justify-content:space-between;
  color:#677487;
  font-size:9px;
}
.judges{
  display:grid;
  grid-template-columns:repeat(3,1fr);
}
.judge{
  padding:11px;
  border-right:1px solid var(--line);
  font-size:9px;
  color:#647083;
  line-height:1.5;
}
.judge:last-child{border-right:0}
.judge b{
  display:block;
  font-size:11px;
  margin-bottom:4px;
}
.check{color:var(--blue)}
.caution{color:#d39800}
.skip{color:var(--red)}
.symbols{
  border-top:1px solid var(--line);
  padding:9px 11px;
  display:flex;
  gap:8px 11px;
  flex-wrap:wrap;
  font-size:9px;
}
.detail{display:none}
.back{
  margin-bottom:12px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:8px;
  padding:8px 10px;
  font-weight:800;
}
.racebox{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 14px rgba(8,29,59,.08);
}
.racehead{
  background:linear-gradient(135deg,var(--navy),#214d80);
  color:#fff;
  padding:11px;
  font-size:13px;
  font-weight:900;
}
.row{
  display:grid;
  grid-template-columns:43px 1fr 56px;
  gap:6px;
  align-items:center;
  padding:11px;
  border-bottom:1px solid #edf0f4;
}
.rn{font-weight:900}
.pill{
  color:#fff;
  border-radius:4px;
  padding:3px 5px;
  font-size:8px;
  font-weight:900;
}
.pcheck{background:var(--green)}
.pcaution{background:var(--yellow)}
.pskip{background:var(--red)}
.rate{
  margin-left:5px;
  font-size:10px;
  font-weight:900;
}
.why{
  margin-top:4px;
  color:#687487;
  font-size:9px;
}
.deadline{
  text-align:right;
  color:#8793a3;
  font-size:8px;
}
.deadline b{
  display:block;
  color:var(--text);
  font-size:11px;
}
@media(max-width:520px){
  .logo{font-size:20px}
  .grid{gap:6px}
  .card{min-height:109px}
  .name{font-size:15px}
  .guide-top{grid-template-columns:1fr}
  .ratebox{
    border-right:0;
    border-bottom:1px solid var(--line)
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">BOAT <b>✓</b> CHECK</div>
  <div class="tag">「買うレース」より、「買わないレース」を見つける。</div>
</header>

<main>

<section id="home">
  <h2>本日の開催場</h2>
  <div class="date" id="date"></div>

  <div class="grid" id="grid"></div>

  <div class="guide">
    <div class="guide-title">見送り度・判定の見方</div>

    <div class="guide-top">
      <div class="ratebox">
        <b>見送り度</b>
        <p>数値が高いほど、買わずに見送る判断を推奨します。</p>
        <div class="bar"></div>
        <div class="scale">
          <span>0%</span>
          <span>100%</span>
        </div>
      </div>

      <div class="judges">
        <div class="judge">
          <b class="check">✓ CHECK</b>
          0〜40%<br>
          比較的狙いやすい
        </div>

        <div class="judge">
          <b class="caution">⚠ CAUTION</b>
          41〜70%<br>
          慎重に判断
        </div>

        <div class="judge">
          <b class="skip">✕ SKIP</b>
          71〜100%<br>
          見送り優先
        </div>
      </div>
    </div>

    <div class="symbols">
      ☀️ モーニング
      🌙 ナイター
      <span class="heart">❤</span> 女子戦
      <span class="grade g3">G3</span>
      <span class="grade g2">G2</span>
      <span class="grade g1">G1</span>
      <span class="grade sg">SG</span>
    </div>
  </div>
</section>

<section class="detail" id="detail">
  <button class="back" onclick="backHome()">← 24場一覧に戻る</button>

  <h2 id="vtitle"></h2>
  <div class="date" id="vmeta"></div>

  <div class="racebox">
    <div class="racehead">1R〜12R　見送り度一覧</div>
    <div id="races"></div>
  </div>
</section>

</main>

<script>
const V=[
["桐生","終了"],
["戸田","一般","2日目","5R","12:44","☀️"],
["江戸川","一般","2日目","4R","12:35","🌙"],
["平和島","女子","最終日","2R","12:35","🌙❤"],

["多摩川","終了"],
["浜名湖","G3","2日目","3R","12:20","❤"],
["蒲郡","一般","2日目","1R","15:17","🌙"],
["常滑","終了"],

["津","一般","3日目","5R","12:24","☀️"],
["三国","終了"],
["びわこ","G2","4日目","5R","12:41","🌙"],
["住之江","G3","2日目","1R","15:25","🌙"],

["尼崎","一般","4日目","5R","12:30","☀️"],
["鳴門","一般","3日目","9R","12:28","☀️"],
["丸亀","終了"],
["児島","終了"],

["宮島","終了"],
["徳山","一般","2日目","9R","12:31","☀️"],
["下関","一般","2日目","1R","15:21","🌙"],
["若松","一般","最終日","1R","15:20","🌙"],

["芦屋","一般","最終日","9R","12:38","☀️"],
["福岡","女子","最終日","1R","12:33","❤"],
["唐津","終了"],
["大村","SG","3日目","1R","15:18","🌙"]
];

const grid=document.getElementById("grid");

document.getElementById("date").textContent=
new Intl.DateTimeFormat("ja-JP",{
year:"numeric",
month:"long",
day:"numeric",
weekday:"short"
}).format(new Date());

function gradeClass(g){
  if(g==="G3")return"g3";
  if(g==="G2")return"g2";
  if(g==="G1")return"g1";
  if(g==="SG")return"sg";
  if(g==="女子")return"women";
  return"normal";
}

function accent(g){
  if(g==="G3")return'<i class="accent g3a"></i>';
  if(g==="G2")return'<i class="accent g2a"></i>';
  if(g==="G1")return'<i class="accent g1a"></i>';
  if(g==="SG")return'<i class="accent sga"></i>';
  return"";
}

V.forEach((v,i)=>{
  const card=document.createElement("div");

  if(v[1]==="終了"){
    card.className="card end";
    card.innerHTML=
    `<div class="name">${v[0]}</div>
     <div class="ended"><b>本日終了</b></div>`;
  }else{
    card.className="card";

    const cls=gradeClass(v[1]);
    const label=v[1]==="女子" ? "女子戦" : v[1];

    card.innerHTML=
    `${accent(v[1])}
     <div class="icons">${v[5]||""}</div>
     <div class="name">${v[0]}</div>

     <div class="meta">
       <span class="grade ${cls}">${label}</span>
       <span>${v[2]}</span>
     </div>

     <div class="race">
       <span class="round">${v[3]}</span>
       <span class="time">
         締切
         <b>${v[4]}</b>
       </span>
     </div>`;

    card.onclick=()=>openVenue(i);
  }

  grid.appendChild(card);
});

function openVenue(i){
  const v=V[i];

  document.getElementById("home").style.display="none";
  document.getElementById("detail").style.display="block";

  document.getElementById("vtitle").textContent=v[0];
  document.getElementById("vmeta").textContent=
  `${v[1]}・${v[2]}　現在 ${v[3]} / 締切 ${v[4]}`;

  let html="";

  for(let n=1;n<=12;n++){
    const rate=(n*17+i*7)%82+12;

    let judge="CHECK";
    let pill="pcheck";
    let reason="比較的安定した条件";

    if(rate>=71){
      judge="SKIP";
      pill="pskip";
      reason="展開不透明で見送り候補";
    }else if(rate>=41){
      judge="CAUTION";
      pill="pcaution";
      reason="不安要素あり。慎重に判断";
    }

    html+=`
    <div class="row">
      <div class="rn">${n}R</div>

      <div>
        <span class="pill ${pill}">${judge}</span>
        <span class="rate">見送り度 ${rate}%</span>
        <div class="why">${reason}</div>
      </div>

      <div class="deadline">
        締切
        <b>${10+Math.floor(n/2)}:${String((n*7+i)%60).padStart(2,"0")}</b>
      </div>
    </div>`;
  }

  document.getElementById("races").innerHTML=html;
  window.scrollTo(0,0);
}

function backHome(){
  document.getElementById("detail").style.display="none";
  document.getElementById("home").style.display="block";
  window.scrollTo(0,0);
}
</script>

</body>
</html>
