<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOAT ✓ CHECK</title>
<style>
:root{--n:#092744;--b:#1671d9;--bg:#f4f6f9;--t:#10223d;--l:#dfe5ec;--r:#df3340;--y:#dda000;--g:#18a568}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:linear-gradient(135deg,#06192f,#0d315d);color:#fff;padding:15px;position:sticky;top:0;z-index:5}.logo{font-size:21px;font-weight:900}.logo b{color:#49a4ff}.tag{font-size:9px;color:#cbd7e8}main{padding:15px 10px 35px;max-width:900px;margin:auto}h2{margin:0 0 4px}.sub{font-size:10px;color:#758196;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.card,.hero,.raceCard,.panel,.boats{background:#fff;border:1px solid var(--l);border-radius:13px;box-shadow:0 6px 16px #08203b12}.card{min-height:108px;padding:8px 5px;position:relative}.name{text-align:center;font-weight:900;font-size:15px;margin:7px 0}.icons{position:absolute;right:5px;top:5px;font-size:12px}.meta{border-top:1px solid #e9edf2;padding-top:6px;display:flex;justify-content:center;gap:5px;font-size:8px;font-weight:800}.grade{border-radius:4px;padding:3px 5px;color:#fff;font-weight:900}.normal,.women{padding:0;color:var(--t)}.g3{background:#1671d9}.g2{background:#79b82e}.g1{background:#b58a2a}.sg{background:#df2937}.race{display:flex;justify-content:center;gap:9px;margin-top:7px;font-size:10px}.race b{font-size:13px}.end{background:#e9edf1}.ended{text-align:center;margin-top:18px}.ended b{background:#3d4651;color:#fff;border-radius:20px;padding:5px 9px;font-size:9px}.panel{margin-top:14px;overflow:hidden}.panelTitle{background:linear-gradient(135deg,var(--n),#214d80);color:#fff;padding:9px 11px;font-size:12px;font-weight:900}.guide{padding:11px;font-size:9px;line-height:1.7}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px}.hidden{display:none}.back{border:1px solid var(--l);background:#fff;border-radius:9px;padding:8px 10px;font-weight:800;margin-bottom:11px}.hero{padding:14px;background:linear-gradient(145deg,#fff,#f8fbff)}.heroTop{display:flex;justify-content:space-between}.venueName{font-size:27px;font-weight:950}.event{border-top:1px solid #e9edf2;margin-top:10px;padding-top:10px;font-size:12px;font-weight:800}.tabs{display:flex;gap:6px;overflow:auto;margin-top:11px}.tab{min-width:65px;background:#eef3f8;border-radius:8px;padding:7px;text-align:center;font-size:9px}.tab b{display:block;font-size:11px}.tab.active{background:var(--n);color:#fff}.section{display:flex;justify-content:space-between;align-items:end;margin:17px 2px 9px}.section h3{margin:0}.section span{font-size:9px;color:#758196}.raceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.raceCard{padding:11px}.rtop,.rbottom{display:flex;justify-content:space-between;align-items:center}.rno{font-size:19px;font-weight:950}.badge{font-size:8px;color:#fff;border-radius:20px;padding:4px 7px;font-weight:900}.check{background:var(--g)}.caution{background:var(--y)}.skip{background:var(--r)}.rate{font-size:10px;font-weight:900;margin-top:8px}.meter{height:5px;background:#edf1f5;border-radius:10px;margin:5px 0 7px;overflow:hidden}.meter i{display:block;height:100%}.rbottom{font-size:9px;color:#758196}.rbottom b{color:var(--t)}.analysis{margin-top:13px;background:var(--n);color:#fff;border-radius:12px;padding:11px;font-size:9px;line-height:1.6}.analysis b{font-size:11px}.big{font-size:30px;font-weight:950}.big small{display:block;font-size:9px;color:#758196}.reason{background:#f5f8fb;border-radius:10px;padding:10px;margin-top:10px;font-size:10px;line-height:1.7}.boats{overflow:hidden}.boat{display:grid;grid-template-columns:30px 1.3fr .6fr .7fr .7fr;align-items:center;border-bottom:1px solid #edf0f4;min-height:48px;font-size:9px}.boat>div{padding:7px 4px}.no{height:100%;display:grid;place-items:center;font-weight:900;font-size:14px}.n1{background:#fff}.n2{background:#222;color:#fff}.n3{background:#ef3340;color:#fff}.n4{background:#2356dc;color:#fff}.n5{background:#f2dc00}.n6{background:#149343;color:#fff}.player b,.cell b{display:block;font-size:10px}.player span,.cell span{color:#758196;font-size:8px}.cell{text-align:center}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.tool{background:#fff;border:1px solid var(--l);border-radius:9px;padding:10px 4px;text-align:center;font-size:9px;font-weight:800}.primary{background:var(--n);color:#fff}
</style></head><body>
<header><div class="logo">BOAT <b>✓</b> CHECK</div><div class="tag">「買うレース」より、「買わないレース」を見つける。</div></header><main>
<section id="home"><h2>本日の開催場</h2><div class="sub" id="today"></div><div class="grid" id="venues"></div><div class="panel"><div class="panelTitle">見送り度・判定の見方</div><div class="guide"><b>見送り度</b>：数値が高いほど見送り推奨<div class="legend"><span>✓ CHECK 0〜40%</span><span>⚠ CAUTION 41〜70%</span><span>✕ SKIP 71〜100%</span><span>☀️ モーニング　🌙 ナイター　❤ 女子戦</span></div></div></div></section>
<section id="venue" class="hidden"><button class="back" onclick="home()">← 24場一覧</button><div class="hero"><div class="heroTop"><div><div class="venueName" id="vn"></div><div class="sub" id="vi"></div></div><div id="vg"></div></div><div class="event" id="ev"></div><div class="tabs" id="tabs"></div></div><div class="section"><h3>レース一覧</h3><span>タップして詳細分析</span></div><div class="raceGrid" id="races"></div><div class="analysis"><b>BOAT ✓ CHECK</b><br>買い目を並べるのではなく、不確定要素を整理して「見送る価値」を可視化。見送り度と理由から先に確認できる設計です。</div></section>
<section id="detail" class="hidden"><button class="back" onclick="venueBack()">← レース一覧</button><div class="hero"><div class="heroTop"><div><div class="sub" id="dv"></div><h2 id="dr"></h2><div class="sub" id="dt"></div></div><div class="big" id="br"></div></div><div class="reason" id="reason"></div></div><div class="section"><h3>出走データ</h3><span>判断に必要な項目を優先</span></div><div class="boats" id="boats"></div><div class="tools"><div class="tool primary">✓ CHECK分析</div><div class="tool">今節成績</div><div class="tool">モーター比較</div><div class="tool">展示・ST</div><div class="tool">枠別データ</div><div class="tool">直前情報</div></div></section>
</main><script>
const V=[["桐生","終了"],["戸田","一般","2日目","5R","12:44","☀️","戸田プリムローズ"],["江戸川","一般","2日目","4R","12:35","🌙","江戸川ボートレース杯"],["平和島","女子","最終日","2R","12:35","🌙❤","ヴィーナスシリーズ"],["多摩川","終了"],["浜名湖","G3","2日目","3R","12:20","❤","オールレディース"],["蒲郡","一般","2日目","1R","15:17","🌙","蒲郡市長杯"],["常滑","終了"],["津","一般","3日目","5R","12:24","☀️","津インクル杯"],["三国","終了"],["びわこ","G2","4日目","5R","12:41","🌙","モーターボート大賞"],["住之江","G3","2日目","1R","15:25","🌙","企業杯"],["尼崎","一般","4日目","5R","12:30","☀️","尼崎センプルカップ"],["鳴門","一般","3日目","9R","12:28","☀️","鳴門市長杯"],["丸亀","終了"],["児島","終了"],["宮島","終了"],["徳山","一般","2日目","9R","12:31","☀️","徳山クラウン争奪戦"],["下関","一般","2日目","1R","15:21","🌙","海響ドリームナイター"],["若松","一般","最終日","1R","15:20","🌙","若松夜王シリーズ"],["芦屋","一般","最終日","9R","12:38","☀️","芦屋モーニングカップ"],["福岡","女子","3日目","1R","11:48","❤","三都市対抗戦 福岡観光コンベンションビューロー杯"],["唐津","終了"],["大村","SG","3日目","1R","15:18","🌙","ボートレースメモリアル"]];
const $=x=>document.getElementById(x),gc=g=>g==="G3"?"g3":g==="G2"?"g2":g==="G1"?"g1":g==="SG"?"sg":g==="女子"?"women":"normal";$("today").textContent=new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(new Date());let cur=0;
V.forEach((v,i)=>{let c=document.createElement("div");c.className="card "+(v[1]==="終了"?"end":"");if(v[1]==="終了")c.innerHTML=`<div class=name>${v[0]}</div><div class=ended><b>本日終了</b></div>`;else{c.innerHTML=`<div class=icons>${v[5]||""}</div><div class=name>${v[0]}</div><div class=meta><span class="grade ${gc(v[1])}">${v[1]==="女子"?"女子戦":v[1]}</span><span>${v[2]}</span></div><div class=race><b>${v[3]}</b><span>締切 <b>${v[4]}</b></span></div>`;c.onclick=()=>openV(i)}$("venues").appendChild(c)});
function openV(i){cur=i;let v=V[i];$("home").classList.add("hidden");$("detail").classList.add("hidden");$("venue").classList.remove("hidden");$("vn").textContent=v[0];$("vi").textContent=`${v[2]} ・ ${v[5]||""}　次回 ${v[3]} / ${v[4]}`;$("vg").innerHTML=`<span class="grade ${gc(v[1])}">${v[1]==="女子"?"女子戦":v[1]}</span>`;$("ev").textContent=v[6];$("tabs").innerHTML=["09/02 初日","09/03 2日目","09/04 3日目","09/05 4日目","09/06 5日目","09/07 最終日"].map((x,n)=>{let p=x.split(" ");return `<div class="tab ${n===2?"active":""}"><b>${p[0]}</b>${p[1]}</div>`}).join("");let h="";for(let n=1;n<=12;n++){let rate=Math.min((n*19+i*11)%87+8,96),j=rate>=71?"SKIP":rate>=41?"CAUTION":"CHECK",cl=j.toLowerCase(),col=j==="SKIP"?"var(--r)":j==="CAUTION"?"var(--y)":"var(--g)",time=`${10+Math.floor(n/2)}:${String((n*13+i*3)%60).padStart(2,"0")}`;h+=`<div class=raceCard onclick="openR(${n},${rate},'${j}','${time}')"><div class=rtop><span class=rno>${n}R</span><span class="badge ${cl}">${j}</span></div><div class=rate>見送り度 ${rate}%</div><div class=meter><i style="width:${rate}%;background:${col}"></i></div><div class=rbottom><span>締切 <b>${time}</b></span><span>分析を見る ›</span></div></div>`}$("races").innerHTML=h;scrollTo(0,0)}
function openR(n,rate,j,time){let v=V[cur];$("venue").classList.add("hidden");$("detail").classList.remove("hidden");$("dv").textContent=`${v[0]} ${v[2]} ・ ${v[1]==="女子"?"女子戦":v[1]}`;$("dr").textContent=`${n}R 予選`;$("dt").textContent=`締切予定 ${time}`;let col=j==="SKIP"?"var(--r)":j==="CAUTION"?"var(--y)":"var(--g)";$("br").innerHTML=`<small>見送り度</small><span style="color:${col}">${rate}%</span><small style="color:${col}">${j}</small>`;let rs=rate>=71?["軸艇の信頼度が低め","攻め候補が複数","機力差が小さく決め手不足"]:rate>=41?["一部に不安要素あり","展示・ST確認後の判断を推奨","無理に買う必要はない条件"]:["軸候補の条件が比較的安定","展開の不確定要素が少なめ","直前情報で最終判断"];$("reason").innerHTML="<b>✓ BOAT CHECK 分析</b><br>"+rs.map(x=>"・"+x).join("<br>");let names=["林 恵祐","繁野谷圭介","作間 章","佐藤大騎","杉村賢也","甲斐寛大"],cls=["B1","A2","A1","B1","B1","B2"],h="";for(let i=0;i<6;i++){h+=`<div class=boat><div class="no n${i+1}">${i+1}</div><div class=player><b>${names[i]}</b><span>${3900+i*173} / ${cls[i]}</span></div><div class=cell><b>${(5.1+((i+n)%18)/10).toFixed(2)}</b><span>勝率</span></div><div class=cell><b>${32+((n*7+i*11)%34)}%</b><span>モーター</span></div><div class=cell><b>${(0.11+((n+i)%9)/100).toFixed(2)}</b><span>平均ST</span></div></div>`}$("boats").innerHTML=h;scrollTo(0,0)}
function home(){$("venue").classList.add("hidden");$("home").classList.remove("hidden");scrollTo(0,0)}function venueBack(){$("detail").classList.add("hidden");$("venue").classList.remove("hidden");scrollTo(0,0)}
</script></body></html>
