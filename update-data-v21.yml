name: Update BOAT CHECK data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: boat-check-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Collect today's official race data
        run: python scripts/collect_today.py --out data/today.json

      - name: Commit data when changed
        run: |
          git config user.name "boat-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/today.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update BOAT CHECK data"
            git push
          fi
