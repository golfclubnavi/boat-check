name: BOAT CHECK previous and next day
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: boat-check-adjacent
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: git pull --ff-only origin main
      - name: Fetch date-specific race cards
        run: python scripts/collect_adjacent_days.py
      - name: Data quality summary
        run: python scripts/check_data_quality.py
      - name: Publish with optimistic main-branch retries
        run: python scripts/publish_data.py --mode files --message 'Refresh adjacent BOAT CHECK dates' data/yesterday.json data/tomorrow.json
