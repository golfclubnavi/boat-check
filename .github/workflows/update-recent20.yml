name: Update recent 30 race history

on:
  workflow_dispatch:
  schedule:
    # JST 01:10。日付更新後のtoday.jsonを使い、1日1回だけ更新する。
    - cron: "10 16 * * *"

permissions:
  contents: write

concurrency:
  group: boat-check-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install requests lhafile

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Collect recent history and ST ranks for every active racer
        run: python scripts/collect_recent20.py --input data/today.json --out data/recent20.json --days 365 --workers 16 --per-course 30

      - name: Data quality summary
        run: python scripts/check_data_quality.py
      - name: Publish with optimistic main-branch retries
        run: python scripts/publish_data.py --mode files --message 'Update recent 30 race history' data/recent20.json
