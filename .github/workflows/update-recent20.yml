name: Update recent 30 race history

on:
  workflow_dispatch:
  schedule:
    # JST 01:10。日付更新後のtoday.jsonを使い、1日1回だけ更新する。
    - cron: "10 16 * * *"

permissions:
  contents: write

concurrency:
  # 5分ごとのライブ更新とpushを重ねない。
  group: boat-check-data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install requests lhafile

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Collect recent history and ST ranks for every active racer
        run: python scripts/collect_recent20.py --input data/today.json --out data/recent20.json --days 365 --workers 16 --per-course 30

      - name: Save recent history when changed
        run: |
          git config user.name "boat-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/recent20.json
          if git diff --cached --quiet; then
            echo "No recent-history changes."
            exit 0
          fi
          git commit -m "Update recent 30 race history with ST ranks"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 3))
          done
          exit 1
