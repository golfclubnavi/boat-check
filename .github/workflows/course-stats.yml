name: Update course statistics
on:
  workflow_dispatch:
  schedule:
    # Daily JST 07:45; cached 365-day archive means subsequent runs fetch only missing days.
    - cron: '45 22 * * *'
permissions:
  contents: write
concurrency:
  group: boat-check-course-stats
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests lhafile
      - uses: actions/cache@v4
        with:
          path: .cache/course-results
          key: course-results-v1-${{ github.run_id }}
          restore-keys: course-results-v1-
      - run: git fetch origin main && git reset --hard origin/main
      - name: Update one-year course rates for current racers
        run: python scripts/collect_course_stats.py --input data/today.json --out data/course-stats.json --workers 16
      - name: Report coverage
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/course-stats.json'))
          print(f"[course] racers={d['racerCount']} days={d['daysCollected']}/{d['daysExpected']} errors={len(d['errors'])}")
          if d['daysCollected'] < d['daysExpected'] * .8:
              raise SystemExit('Fewer than 80% of official result days downloaded; keep previously published statistics')
          PY
      - name: Data quality summary
        run: python scripts/check_data_quality.py
      - name: Publish course statistics
        run: python scripts/publish_data.py --mode files --message 'Update BOAT CHECK course statistics' data/course-stats.json
