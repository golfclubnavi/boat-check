name: Update racer and motor details
on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *"
permissions:
  contents: write
concurrency:
  group: boat-check-entry-details
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install requests lhafile beautifulsoup4
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Restore official result cache
        uses: actions/cache@v4
        with:
          path: .cache/entry-results
          key: entry-results-v1-${{ github.run_id }}
          restore-keys: entry-results-v1-
      - name: Collect official race-card deductions
        run: python scripts/collect_accident_updates.py --input data/today.json --ledger data/accident-ledger.json
      - name: Collect racer and motor details
        run: python scripts/collect_entry_data.py --input data/today.json --out data/entry-details.json --accident-ledger data/accident-ledger.json --workers 6
      - name: Data quality summary
        run: python scripts/check_data_quality.py
      - name: Publish with optimistic main-branch retries
        run: python scripts/publish_data.py --mode files --message 'Update racer and motor details' data/entry-details.json data/accident-ledger.json
