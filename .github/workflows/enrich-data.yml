name: Enrich BOAT CHECK data

on:
  workflow_dispatch:
  schedule:
    # 07:30 JST = 22:30 UTC (前日)
    - cron: "30 22 * * *"

concurrency:
  group: boat-check-enrich-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: pip install requests beautifulsoup4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Enrich racer and meeting data
        run: python scripts/collect_today.py --enrich --out data/today.json --workers 10

      - name: Commit enriched data when changed
        run: |
          git config user.name "boat-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/today.json data/racers.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Enrich BOAT CHECK data"
          git pull --rebase origin main
          git push origin HEAD:main
