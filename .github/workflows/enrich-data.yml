name: Enrich BOAT CHECK data

on:
  workflow_dispatch:
  schedule:
    # 00:20 JST = previous day 15:20 UTC
    # Midnight live update normally enriches automatically; this is a fallback.
    - cron: "20 15 * * *"
    # 07:30 JST = previous day 22:30 UTC
    # Morning refresh catches official lineup/equipment changes.
    - cron: "30 22 * * *"

concurrency:
  group: boat-check-enrich
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: pip install requests beautifulsoup4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Enrich racer, current-meet, motor and boat data
        run: python scripts/collect_today.py --enrich --out data/today.json --workers 10

      - name: Data quality summary
        run: python scripts/check_data_quality.py
      - name: Publish with optimistic main-branch retries
        run: python scripts/publish_data.py --mode enrich --message 'Enrich BOAT CHECK current-meet data' data/today.json data/racers.json
