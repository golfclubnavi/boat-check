name: Live BOAT CHECK data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: boat-check-data-update
  # Enrich実行中に5分更新が来てもEnrichを中断しない。
  # 同じグループで待機させ、完了後に最新の更新へ進む。
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: pip install requests beautifulsoup4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Refresh deadlines, exhibition, current-meet scores and results
        run: python scripts/collect_today.py --live --out data/today.json --workers 8

      - name: Commit live data when changed
        run: |
          git config user.name "boat-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/today.json
          if git diff --cached --quiet; then
            echo "No live data changes."
            exit 0
          fi
          git commit -m "Refresh BOAT CHECK live data"
          git pull --rebase origin main
          git push origin HEAD:main
