name: Update BOAT CHECK data
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: boat-check-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Collect official race data
        run: python scripts/collect_today.py --deep --out data/today.json
      - name: Commit data when changed
        run: |
          git config user.name "boat-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/today.json data/racers.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update BOAT CHECK data"
          git push origin HEAD:main
