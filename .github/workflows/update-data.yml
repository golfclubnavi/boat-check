name: Live BOAT CHECK data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: boat-check-live
  # Only this job family shares its queue.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: pip install requests beautifulsoup4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Collect and publish bounded two-minute LIVE rounds
        env:
          CF_LIVE_URL: ${{ vars.CF_LIVE_URL }}
          CF_LIVE_TOKEN: ${{ secrets.CF_LIVE_TOKEN }}
        run: python scripts/run_live_window.py --rounds 3 --interval 120
