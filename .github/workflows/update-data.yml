name: Update BOAT CHECK data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: boat-check-data-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: pip install requests beautifulsoup4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Collect official race and live data
        run: python scripts/collect_today.py --out data/today.json --workers 8

      - name: Commit data when changed
        run: |
          git config user.name "boat-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/today.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update BOAT CHECK official data"
          git pull --rebase origin main
          git push origin HEAD:main
